openapi: 3.0.3
info:
  title: API Sistema Inteligente de Control de Peaje
  version: 1.0.0
  description: Autenticación con Google; todas las rutas (excepto /auth/google) requieren
    Bearer token.
paths:
  /api/v1/agente/chat:
    post:
      operationId: v1_agente_chat_create
      summary: Mensaje al agente conversacional
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ajustes/inferencia:
    get:
      operationId: v1_ajustes_inferencia_retrieve
      description: URL y API key del endpoint de inferencia, editables por el administrador
        sin tocar el servidor.
      summary: Ajustes del endpoint de inferencia
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: v1_ajustes_inferencia_update
      description: URL y API key del endpoint de inferencia, editables por el administrador
        sin tocar el servidor.
      summary: Cambiar URL y/o API key del endpoint de inferencia
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ajustes/llm:
    get:
      operationId: v1_ajustes_llm_retrieve
      description: Modelo de lenguaje del agente (API compatible con OpenAI), editable
        desde el panel.
      summary: Ajustes del LLM del agente
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: v1_ajustes_llm_update
      description: Modelo de lenguaje del agente (API compatible con OpenAI), editable
        desde el panel.
      summary: Cambiar URL base, modelo y/o API key del LLM
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/alertas/:
    get:
      operationId: v1_alertas_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
